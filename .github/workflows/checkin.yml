name: check_in_321018142

on:
  schedule:
    # 北京时间 9:18 = UTC 1:18
    - cron: '18 1 * * *'
  workflow_dispatch:

jobs:
  daily-checkin:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests

      - name: Random Delay
        run: python3 -c "import time, random; sleep_time = random.randint(0, 10); print(f'Sleeping {sleep_time}s...'); time.sleep(sleep_time)"

      - name: Run Check-in
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE_321018142 }}
          GLADOS_TOKEN: ${{ secrets.GLADOS_TOKEN_321018142 }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME_321018142 }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD_321018142 }}
          MAIL_TO: ${{ secrets.MAIL_TO_321018142 }}
          MAIL_SMTP_SERVER: ${{ secrets.MAIL_SMTP_SERVER_321018142 }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT_321018142 }}
        run: python3 main.py
