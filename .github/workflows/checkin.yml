name: Glados Daily Checkin

on:
  # 允许手动触发 (方便测试)
  workflow_dispatch:
  # 定时触发
  schedule:
    # 每天 UTC 时间 01:00 (即北京时间 09:00) 触发
    # 配合脚本里的随机休眠，实际签到时间会在 09:00 ~ 12:00 之间随机
    - cron: '0 1 * * *'

jobs:
  checkin:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run checkin script
        env:
          # 将 Secret 注入到环境变量中
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_TOKEN: ${{ secrets.GLADOS_TOKEN }}
        run: python main.py
