name: check_in_545443766

on:
  schedule:
    # 北京时间 9:11 = UTC 1:11
    - cron: '11 1 * * *'
  workflow_dispatch:

jobs:
  daily-checkin-545443766:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests

      - name: Random Delay
        run: python3 -c "import time, random; sleep_time = random.randint(0, 10); print(f'Sleeping {sleep_time}s...'); time.sleep(sleep_time)"

      - name: Run Check-in
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE_545443766 }}
          GLADOS_TOKEN: ${{ secrets.GLADOS_TOKEN }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_SMTP_SERVER: ${{ secrets.MAIL_SMTP }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
        run: python3 main.py
